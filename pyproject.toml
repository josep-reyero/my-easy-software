[project]
name = "my-easy-software"
version = "0.1.0"
description = "A framework and one command, mes, for small personal apps that expose your own data to you and to your AI agents."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
mes = "mes.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mes"]

[tool.pytest.ini_options]
testpaths = ["tests"]
